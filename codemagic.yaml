workflows:
  ios-project-debug:
    name: iOS debug
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "GameApp.xcodeproj"
        XCODE_SCHEME: "GameApp"
    scripts:
      - name: Run SwiftLint
        script: |
          brew install swiftlint
          swiftlint lint --strict
      - name: Vulnerability scan
        script: |
          brew install osv-scanner
          osv-scanner --lockfile=GameApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Build debug app
        script: |
          xcodebuild build \
          -project "$XCODE_PROJECT" \
          -scheme "$XCODE_SCHEME" \
          -skipPackagePluginValidation \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      email:
        recipients:
          - jonrysimbolon19@gmail.com
